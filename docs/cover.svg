<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#10233b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- flask glyph -->
  <g transform="translate(150,150)" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round">
    <path d="M70 0 h60 v70 l85 150 a40 40 0 0 1 -35 60 h-160 a40 40 0 0 1 -35 -60 l85 -150 z"/>
    <line x1="70" y1="0" x2="130" y2="0"/>
    <path d="M55 190 h90" stroke="#22c55e"/>
  </g>

  <text x="150" y="470" font-family="Helvetica, Arial, sans-serif" font-size="170" font-weight="700" fill="#e2e8f0">Galen</text>

  <text x="158" y="545" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="400" fill="#94a3b8">The voice knowledge bank for pharmaceutical manufacturing</text>

  <text x="158" y="620" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#38bdf8">Capture the huddle · Extract the knowledge · Answer by voice</text>

  <!-- waveform -->
  <g transform="translate(150,760)" fill="url(#wave)">
    <rect x="0"   y="80"  width="14" height="40"  rx="7"/>
    <rect x="34"  y="50"  width="14" height="100" rx="7"/>
    <rect x="68"  y="10"  width="14" height="180" rx="7"/>
    <rect x="102" y="60"  width="14" height="80"  rx="7"/>
    <rect x="136" y="25"  width="14" height="150" rx="7"/>
    <rect x="170" y="75"  width="14" height="50"  rx="7"/>
    <rect x="204" y="35"  width="14" height="130" rx="7"/>
    <rect x="238" y="65"  width="14" height="70"  rx="7"/>
    <rect x="272" y="0"   width="14" height="200" rx="7"/>
    <rect x="306" y="55"  width="14" height="90"  rx="7"/>
    <rect x="340" y="30"  width="14" height="140" rx="7"/>
    <rect x="374" y="80"  width="14" height="40"  rx="7"/>
    <rect x="408" y="45"  width="14" height="110" rx="7"/>
    <rect x="442" y="70"  width="14" height="60"  rx="7"/>
    <rect x="476" y="20"  width="14" height="160" rx="7"/>
    <rect x="510" y="60"  width="14" height="80"  rx="7"/>
  </g>

  <!-- badges -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="30">
    <rect x="150" y="1000" width="360" height="60" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="182" y="1040" fill="#e2e8f0">AssemblyAI · Realtime STT</text>

    <rect x="530" y="1000" width="330" height="60" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="562" y="1040" fill="#e2e8f0">LLM Gateway · Cited</text>

    <rect x="880" y="1000" width="300" height="60" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="912" y="1040" fill="#e2e8f0">ICH Q10 §1.6.1</text>
  </g>

  <text x="1770" y="1040" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#64748b">Voice Agent Hackathon 2026</text>
</svg>
